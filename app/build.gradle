plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.lumen.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.lumen.tv'
        minSdk 22
        targetSdk 28      // Fire OS 7 = Android 9 : permet de lancer l'appli au démarrage
        versionCode Integer.valueOf((project.findProperty('VC') ?: '1').toString())
        versionName '1.1'
        buildConfigField 'String', 'LUMEN_URL', "\"${project.findProperty('LUMEN_URL') ?: 'http://192.168.1.34:8800/?tv=1'}\""
    }
    signingConfigs {
        lumen {
            // Clé fixe : sans elle, chaque compilation GitHub est signée autrement et le Fire Stick refuse la mise à jour.
            storeFile file('../lumen.keystore')
            storePassword 'lumen123'
            keyAlias 'lumen'
            keyPassword 'lumen123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.lumen }
        release { signingConfig signingConfigs.lumen }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
