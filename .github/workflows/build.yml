name: Compiler Lumen TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler
        run: gradle --no-daemon assembleDebug -PVC=${{ github.run_number }}
      - name: Préparer le fichier
        run: cp app/build/outputs/apk/debug/app-debug.apk lumen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: lumen.apk
      - name: Publier (lien de téléchargement fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere
          name: Lumen TV (dernière version)
          files: lumen.apk
          make_latest: true
